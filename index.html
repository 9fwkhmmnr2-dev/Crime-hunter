<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CRIMEHUNTER — OIC</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080706;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

canvas {
    display: block;
}


/* =====================================================
   UI
===================================================== */

#ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

#topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    padding: 0 24px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        linear-gradient(
            rgba(0,0,0,.65),
            rgba(0,0,0,0)
        );
}

.logo {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 4px;
}

.oic {
    margin-top: 4px;
    font-size: 10px;
    color: #aaa;
    letter-spacing: 2px;
}

.reputation {
    padding: 9px 14px;

    background: rgba(15,13,10,.85);

    border: 1px solid rgba(255,210,130,.35);

    font-size: 13px;
}

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 7px;
    height: 7px;

    transform: translate(-50%, -50%);

    border: 1px solid rgba(255,255,255,.75);

    border-radius: 50%;
}

#interaction {
    position: absolute;

    left: 50%;
    bottom: 11%;

    transform: translateX(-50%);

    padding: 11px 18px;

    background: rgba(0,0,0,.82);

    border: 1px solid #777;

    font-size: 12px;
    letter-spacing: 1px;

    opacity: 0;

    transition: opacity .15s;
}

#interaction.visible {
    opacity: 1;
}


/* =====================================================
   ROTACIÓN
===================================================== */

#rotateScreen {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 9999;

    background: #080706;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}

.rotateBox h1 {
    font-size: 32px;
    letter-spacing: 5px;
    margin-bottom: 18px;
}

.rotateBox p {
    color: #aaa;
    line-height: 1.5;
}


/* =====================================================
   CONTROLES MÓVILES
===================================================== */

#mobileControls {
    display: none;

    position: absolute;
    inset: 0;

    pointer-events: none;
}

#joystick {
    position: absolute;

    width: 125px;
    height: 125px;

    left: 28px;
    bottom: 28px;

    border-radius: 50%;

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,255,255,.2);

    pointer-events: auto;

    touch-action: none;
}

#joystickKnob {
    position: absolute;

    width: 54px;
    height: 54px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255,255,255,.25);

    border: 1px solid rgba(255,255,255,.4);

    pointer-events: none;
}


/*
Área derecha:
SOLO controla la cámara.
*/

#lookArea {
    position: absolute;

    top: 65px;
    right: 0;
    bottom: 0;
    left: 43%;

    pointer-events: auto;

    touch-action: none;
}


/* Botón interactuar */

#interactButton {
    position: absolute;

    right: 28px;
    bottom: 35px;

    width: 82px;
    height: 82px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.45);

    background: rgba(255,255,255,.1);

    color: white;

    font-size: 11px;
    font-weight: bold;

    pointer-events: auto;

    touch-action: manipulation;
}

#interactButton:active {
    background: rgba(255,255,255,.25);
}


/* =====================================================
   MODAL
===================================================== */

#modal {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.72);

    pointer-events: auto;
}

#modal.active {
    display: flex;
}

.modalBox {
    width: min(620px, 90vw);

    padding: 32px;

    background: #12100e;

    border: 1px solid #594936;

    box-shadow: 0 20px 70px rgba(0,0,0,.8);
}

.modalBox h2 {
    margin-bottom: 15px;

    font-size: 23px;

    letter-spacing: 3px;
}

.modalBox p {
    color: #bbb;

    line-height: 1.6;

    margin-bottom: 25px;
}

.modalButton {
    padding: 12px 22px;

    background: #ddd;

    color: #111;

    border: none;

    font-weight: bold;
}


/* =====================================================
   CELULAR
===================================================== */

@media (orientation: portrait) {

    #rotateScreen {
        display: flex;
    }

    canvas,
    #ui {
        visibility: hidden;
    }
}


@media (orientation: landscape) and (max-width: 900px) {

    #mobileControls {
        display: block;
    }

    #topbar {
        height: 55px;
        padding: 0 13px;
    }

    .logo {
        font-size: 14px;
    }

    .oic {
        font-size: 7px;
    }

    .reputation {
        font-size: 10px;
        padding: 7px 10px;
    }

    #interaction {
        bottom: 18%;
        font-size: 10px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     ROTACIÓN
===================================================== -->

<div id="rotateScreen">

    <div class="rotateBox">

        <h1>CRIMEHUNTER</h1>

        <p>
            Gira el teléfono horizontalmente
            para entrar a la oficina.
        </p>

    </div>

</div>


<!-- =====================================================
     INTERFAZ
===================================================== -->

<div id="ui">

    <div id="topbar">

        <div>

            <div class="logo">
                CRIMEHUNTER
            </div>

            <div class="oic">
                OFICINA DE INVESTIGACIONES DE CRÍMENES
            </div>

        </div>

        <div class="reputation">

            REPUTACIÓN:

            <strong id="reputation">
                3500
            </strong>

        </div>

    </div>


    <div id="crosshair"></div>


    <div id="interaction">
        E — INTERACTUAR
    </div>


    <!-- CONTROLES MÓVILES -->

    <div id="mobileControls">

        <div id="joystick">

            <div id="joystickKnob"></div>

        </div>


        <div id="lookArea"></div>


        <button id="interactButton">
            INTERACTUAR
        </button>

    </div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal">

    <div class="modalBox">

        <h2 id="modalTitle">
            CRIMEHUNTER
        </h2>

        <p id="modalText">
            ...
        </p>

        <button
            class="modalButton"
            onclick="closeModal()">

            CERRAR

        </button>

    </div>

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
} from "three/addons/controls/PointerLockControls.js";


/* =====================================================
   ESCENA
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x15110c);

scene.fog =
    new THREE.Fog(
        0x15110c,
        5,
        18
    );


/* =====================================================
   CÁMARA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        68,
        window.innerWidth /
        window.innerHeight,
        .1,
        50
    );


/*
   POSICIÓN INICIAL:
   El detective empieza sentado
   frente al escritorio.
*/

camera.position.set(
    0,
    1.62,
    3.15
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.7
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   ILUMINACIÓN GENERAL
===================================================== */

/*
   Luz ambiental bastante mayor
   para que la oficina no quede negra.
*/

const ambient =
    new THREE.AmbientLight(
        0xffe9c7,
        1.15
    );

scene.add(ambient);


/*
   Luz cálida de la lámpara.
*/

const lampLight =
    new THREE.PointLight(
        0xffb85c,
        75,
        11,
        1.8
    );

lampLight.position.set(
    0,
    3.45,
    0.2
);

lampLight.castShadow = true;

lampLight.shadow.mapSize.width = 1024;
lampLight.shadow.mapSize.height = 1024;

scene.add(lampLight);


/*
   Segunda luz suave para eliminar
   zonas completamente oscuras.
*/

const fillLight =
    new THREE.PointLight(
        0xffdca0,
        22,
        10,
        2
    );

fillLight.position.set(
    -3,
    2.8,
    2.5
);

scene.add(fillLight);


/* =====================================================
   MATERIALES
===================================================== */

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x30271f,
        roughness: .8
    });


const wallMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x49413a,
        roughness: .9
    });


const ceilingMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x28231e
    });


const woodMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4a3020,
        roughness: .75
    });


const darkMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x171717,
        roughness: .6
    });


const metalMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x454545,
        metalness: .55,
        roughness: .35
    });


const monitorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x10181a,
        emissive: 0x16404a,
        emissiveIntensity: 1.5
    });


/* =====================================================
   CUBOS
===================================================== */

function box(
    width,
    height,
    depth,
    material,
    x,
    y,
    z
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}


/* =====================================================
   OFICINA COMPACTA
===================================================== */

const ROOM_W = 9;
const ROOM_D = 7;
const ROOM_H = 4;


/* Piso */

box(
    ROOM_W,
    .2,
    ROOM_D,
    floorMaterial,
    0,
    0,
    0
);


/* Pared trasera */

box(
    ROOM_W,
    ROOM_H,
    .2,
    wallMaterial,
    0,
    ROOM_H / 2,
    -ROOM_D / 2
);


/* Pared izquierda */

box(
    .2,
    ROOM_H,
    ROOM_D,
    wallMaterial,
    -ROOM_W / 2,
    ROOM_H / 2,
    0
);


/* Pared derecha */

box(
    .2,
    ROOM_H,
    ROOM_D,
    wallMaterial,
    ROOM_W / 2,
    ROOM_H / 2,
    0
);


/* Frente dividido para dejar salida */

box(
    3.3,
    ROOM_H,
    .2,
    wallMaterial,
    -2.85,
    ROOM_H / 2,
    ROOM_D / 2
);

box(
    3.3,
    ROOM_H,
    .2,
    wallMaterial,
    2.85,
    ROOM_H / 2,
    ROOM_D / 2
);


/* Techo */

box(
    ROOM_W,
    .15,
    ROOM_D,
    ceilingMaterial,
    0,
    ROOM_H,
    0
);


/* =====================================================
   ESCRITORIO
===================================================== */

const desk =
    box(
        3.5,
        .22,
        1.55,
        woodMaterial,
        0,
        1.28,
        .25
    );


/* Patas */

for (const x of [-1.45, 1.45]) {

    for (const z of [-.35, .85]) {

        box(
            .18,
            1.28,
            .18,
            metalMaterial,
            x,
            .64,
            z
        );

    }

}


/* =====================================================
   SILLA DEL DETECTIVE
===================================================== */

box(
    1.25,
    .16,
    1.15,
    darkMaterial,
    0,
    .95,
    2.05
);

box(
    1.1,
    1.2,
    .15,
    darkMaterial,
    0,
    1.55,
    2.55
);

box(
    .1,
    .9,
    .1,
    metalMaterial,
    0,
    .48,
    2.05
);


/* =====================================================
   MONITOR
===================================================== */

const monitor =
    box(
        1.75,
        1.05,
        .12,
        darkMaterial,
        0,
        1.95,
        -.05
    );

monitor.userData.interactive = true;
monitor.userData.type = "computer";


box(
    1.48,
    .76,
    .025,
    monitorMaterial,
    0,
    1.95,
    -.115
);


box(
    .12,
    .45,
    .12,
    metalMaterial,
    0,
    1.5,
    -.05
);


/* =====================================================
   TECLADO
===================================================== */

const keyboard =
    box(
        1.4,
        .06,
        .5,
        metalMaterial,
        0,
        1.42,
        .55
    );

keyboard.userData.interactive = true;
keyboard.userData.type = "computer";


/* =====================================================
   TELÉFONO
===================================================== */

const phone =
    box(
        .45,
        .12,
        .75,
        darkMaterial,
        1.2,
        1.43,
        .55
    );

phone.userData.interactive = true;
phone.userData.type = "phone";


/* =====================================================
   PIZARRA
===================================================== */

const board =
    box(
        4.4,
        1.9,
        .1,
        darkMaterial,
        0,
        2.35,
        -3.38
    );

board.userData.interactive = true;
board.userData.type = "board";


/*
   Pequeñas tarjetas de evidencia.
*/

for (let i = 0; i < 4; i++) {

    const clue =
        box(
            .55,
            .7,
            .025,
            monitorMaterial,
            -1.25 + i * .85,
            2.35,
            -3.32
        );

    clue.userData.interactive = true;
    clue.userData.type = "evidence";

}


/* =====================================================
   ARCHIVADOR
===================================================== */

const cabinet =
    box(
        1.15,
        2.35,
        .85,
        metalMaterial,
        -3.25,
        1.18,
        -2.65
    );

cabinet.userData.interactive = true;
cabinet.userData.type = "files";


/* Cajones */

for (let i = 0; i < 4; i++) {

    box(
        .95,
        .32,
        .04,
        darkMaterial,
        -3.25,
        .45 + i * .52,
        -2.20
    );

}


/* =====================================================
   PUERTA
===================================================== */

const door =
    box(
        2,
        3.5,
        .12,
        woodMaterial,
        0,
        1.75,
        3.38
    );

door.userData.interactive = true;
door.userData.type = "door";


/* =====================================================
   LÁMPARA DE ESCRITORIO
===================================================== */

box(
    1.5,
    .1,
    .5,
    metalMaterial,
    0,
    3.55,
    .2
);


/* =====================================================
   CONTROLES PC
===================================================== */

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


renderer.domElement.addEventListener(
    "click",
    () => {

        if (
            window.innerWidth > 900 &&
            !document
                .getElementById("modal")
                .classList
                .contains("active")
        ) {

            controls.lock();

        }

    }
);


/* =====================================================
   TECLAS
===================================================== */

const keys = {
    w: false,
    s: false,
    a: false,
    d: false
};


document.addEventListener(
    "keydown",
    event => {

        if (event.code === "KeyW")
            keys.w = true;

        if (event.code === "KeyS")
            keys.s = true;

        if (event.code === "KeyA")
            keys.a = true;

        if (event.code === "KeyD")
            keys.d = true;

        if (event.code === "KeyE")
            interact();

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (event.code === "KeyW")
            keys.w = false;

        if (event.code === "KeyS")
            keys.s = false;

        if (event.code === "KeyA")
            keys.a = false;

        if (event.code === "KeyD")
            keys.d = false;

    }
);


/* =====================================================
   JOYSTICK MÓVIL
===================================================== */

const joystick =
    document.getElementById("joystick");

const knob =
    document.getElementById("joystickKnob");

let joystickPointer = null;

let mobileX = 0;
let mobileY = 0;


function setJoystick(clientX, clientY) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let x =
        clientX - centerX;

    let y =
        clientY - centerY;

    const radius = 42;

    const distance =
        Math.sqrt(
            x * x +
            y * y
        );

    if (distance > radius) {

        x =
            (x / distance) *
            radius;

        y =
            (y / distance) *
            radius;

    }

    mobileX = x / radius;
    mobileY = y / radius;

    knob.style.transform =
        `translate(
            calc(-50% + ${x}px),
            calc(-50% + ${y}px)
        )`;

}


joystick.addEventListener(
    "pointerdown",
    event => {

        joystickPointer =
            event.pointerId;

        joystick.setPointerCapture(
            event.pointerId
        );

        setJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if (
            event.pointerId !==
            joystickPointer
        )
            return;

        setJoystick(
            event.clientX,
            event.clientY
        );

    }
);


function resetJoystick() {

    joystickPointer = null;

    mobileX = 0;
    mobileY = 0;

    knob.style.transform =
        "translate(-50%, -50%)";

}


joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =====================================================
   CÁMARA TÁCTIL
===================================================== */

/*
   AHORA la cámara utiliza:

   yaw   = izquierda / derecha
   pitch = arriba / abajo

   Nunca modificamos Z,
   por lo que la vista no se inclina
   de costado.
*/

let yaw = 0;
let pitch = 0;

let lookPointer = null;

let lastLookX = 0;
let lastLookY = 0;


const lookArea =
    document.getElementById("lookArea");


lookArea.addEventListener(
    "pointerdown",
    event => {

        lookPointer =
            event.pointerId;

        lookArea.setPointerCapture(
            event.pointerId
        );

        lastLookX =
            event.clientX;

        lastLookY =
            event.clientY;

    }
);


lookArea.addEventListener(
    "pointermove",
    event => {

        if (
            event.pointerId !==
            lookPointer
        )
            return;

        const dx =
            event.clientX -
            lastLookX;

        const dy =
            event.clientY -
            lastLookY;

        lastLookX =
            event.clientX;

        lastLookY =
            event.clientY;


        yaw -= dx * 0.006;

        pitch -= dy * 0.006;


        /*
           Limitar mirada arriba/abajo.
        */

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.25,
                1.25
            );


        /*
           IMPORTANTE:
           solo X e Y.

           No se toca Z.
        */

        camera.rotation.order =
            "YXZ";

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;

        camera.rotation.z =
            0;

    }
);


lookArea.addEventListener(
    "pointerup",
    () => {

        lookPointer = null;

    }
);


lookArea.addEventListener(
    "pointercancel",
    () => {

        lookPointer = null;

    }
);


/* =====================================================
   BOTÓN INTERACTUAR
===================================================== */

document
    .getElementById("interactButton")
    .addEventListener(
        "click",
        interact
    );


/* =====================================================
   RAYCASTER
===================================================== */

const raycaster =
    new THREE.Raycaster();

const center =
    new THREE.Vector2(
        0,
        0
    );

let currentObject = null;


function detectObject() {

    raycaster.setFromCamera(
        center,
        camera
    );

    const interactiveObjects =
        scene.children.filter(
            object =>
                object.userData &&
                object.userData.interactive
        );

    const hits =
        raycaster.intersectObjects(
            interactiveObjects,
            false
        );


    if (
        hits.length > 0 &&
        hits[0].distance < 3.5
    ) {

        currentObject =
            hits[0].object;

        const interaction =
            document.getElementById(
                "interaction"
            );

        interaction.classList.add(
            "visible"
        );

        interaction.textContent =
            window.innerWidth <= 900
                ? "INTERACTUAR"
                : "E — INTERACTUAR";

    } else {

        currentObject = null;

        document
            .getElementById(
                "interaction"
            )
            .classList.remove(
                "visible"
            );

    }

}


/* =====================================================
   INTERACCIONES
===================================================== */

function interact() {

    if (!currentObject)
        return;


    const type =
        currentObject.userData.type;


    if (type === "computer") {

        openModal(
            "COMPUTADORA OIC",
            "Desde esta terminal podrás acceder a las cámaras de seguridad, consultar registros y analizar las grabaciones del caso."
        );

    }


    else if (type === "board") {

        openModal(
            "PIZARRA DE INVESTIGACIÓN",
            "Aquí se organizarán las evidencias, sospechosos y conexiones descubiertas durante la investigación."
        );

    }


    else if (type === "evidence") {

        openModal(
            "EVIDENCIA",
            "Esta evidencia todavía no ha sido analizada. Próximamente podrás ampliarla, examinarla y vincularla con un sospechoso."
        );

    }


    else if (type === "files") {

        openModal(
            "ARCHIVADOR",
            "Aquí se encuentran los expedientes de la OIC. Podrás revisar casos actuales, casos resueltos y casos sin resolver."
        );

    }


    else if (type === "phone") {

        openModal(
            "TELÉFONO",
            "Línea interna de la OIC. Las llamadas importantes de la central aparecerán aquí."
        );

    }


    else if (type === "door") {

        openModal(
            "SALIR DE LA OFICINA",
            "Aquí podrás abandonar el despacho y regresar a la pantalla de casos."
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function openModal(
    title,
    text
) {

    document.getElementById(
        "modalTitle"
    ).textContent = title;

    document.getElementById(
        "modalText"
    ).textContent = text;

    document.getElementById(
        "modal"
    ).classList.add(
        "active"
    );


    if (
        window.innerWidth > 900 &&
        controls.isLocked
    ) {

        controls.unlock();

    }

}


window.closeModal =
function () {

    document.getElementById(
        "modal"
    ).classList.remove(
        "active"
    );

};


/* =====================================================
   MOVIMIENTO
===================================================== */

const clock =
    new THREE.Clock();


function movePlayer(delta) {

    /*
       Velocidad deliberadamente baja:
       la oficina es pequeña.
    */

    const speed =
        2.1 * delta;


    let forward = 0;
    let side = 0;


    if (keys.w)
        forward += 1;

    if (keys.s)
        forward -= 1;

    if (keys.a)
        side -= 1;

    if (keys.d)
        side += 1;


    /*
       Móvil.

       mobileY negativo =
       joystick hacia arriba =
       avanzar.

       mobileX negativo =
       izquierda.

       Esto evita la inversión
       que había antes.
    */

    forward +=
        -mobileY;

    side +=
        mobileX;


    const length =
        Math.sqrt(
            forward * forward +
            side * side
        );


    if (length > 1) {

        forward /= length;
        side /= length;

    }


    /*
       PC
    */

    if (
        window.innerWidth > 900
    ) {

        if (forward !== 0)
            controls.moveForward(
                forward * speed
            );

        if (side !== 0)
            controls.moveRight(
                side * speed
            );

    }


    /*
       MÓVIL
    */

    else {

        const forwardVector =
            new THREE.Vector3();

        camera.getWorldDirection(
            forwardVector
        );

        forwardVector.y = 0;

        forwardVector.normalize();


        const rightVector =
            new THREE.Vector3();

        rightVector.crossVectors(
            forwardVector,
            camera.up
        ).normalize();


        camera.position.addScaledVector(
            forwardVector,
            forward * speed
        );

        camera.position.addScaledVector(
            rightVector,
            side * speed
        );

    }


    /*
       El detective no puede salir
       del pequeño despacho.
    */

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -3.7,
            3.7
        );


    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -2.7,
            3.0
        );


    /*
       Altura del personaje sentado.

       No hay movimiento vertical.
    */

    camera.position.y =
        1.62;

}


/* =====================================================
   ANIMACIÓN
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    movePlayer(delta);

    detectObject();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   ESTADO DE CRIMEHUNTER
===================================================== */

const gameState = {

    reputation: 3500,

    currentCase: null,

    suspects: [],

    evidence: [],

    cameras: [],

    guiltySuspect: null,

    keyEvidence: null

};


window.Crimehunter =
    gameState;

</script>
