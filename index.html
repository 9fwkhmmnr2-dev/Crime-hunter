<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CRIMEHUNTER — OIC</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

canvas {
    display: block;
}

/* =========================
   INTERFAZ
========================= */

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

#topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 65px;
    padding: 0 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: linear-gradient(
        rgba(0,0,0,.85),
        rgba(0,0,0,0)
    );
}

.logo {
    font-weight: 900;
    letter-spacing: 4px;
    font-size: 18px;
}

.oic {
    color: #999;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 3px;
}

.reputation {
    border: 1px solid #555;
    background: rgba(10,10,10,.8);
    padding: 9px 14px;
    font-size: 13px;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 8px;
    height: 8px;

    transform: translate(-50%, -50%);

    border: 1px solid rgba(255,255,255,.8);
    border-radius: 50%;
}

#interaction {
    position: absolute;

    left: 50%;
    bottom: 12%;

    transform: translateX(-50%);

    background: rgba(0,0,0,.82);
    border: 1px solid #777;

    padding: 12px 20px;

    font-size: 13px;
    letter-spacing: 1px;

    opacity: 0;
    transition: opacity .2s;
}

#interaction.visible {
    opacity: 1;
}

/* =========================
   MOBILE
========================= */

#rotateScreen {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 999;

    background: #050505;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}

.rotateBox h1 {
    font-size: 35px;
    letter-spacing: 5px;
    margin-bottom: 20px;
}

.rotateBox p {
    color: #999;
    line-height: 1.5;
}

/* =========================
   CONTROLES
========================= */

#mobileControls {
    display: none;

    position: absolute;
    inset: 0;
}

#joystick {
    position: absolute;

    width: 130px;
    height: 130px;

    left: 35px;
    bottom: 35px;

    border-radius: 50%;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.18);
}

#joystickKnob {
    position: absolute;

    width: 55px;
    height: 55px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255,255,255,.25);
    border: 1px solid rgba(255,255,255,.4);
}

#lookArea {
    position: absolute;

    right: 0;
    top: 70px;
    bottom: 0;
    left: 45%;

    touch-action: none;
}

#interactButton {
    position: absolute;

    right: 35px;
    bottom: 45px;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.4);

    color: white;

    font-size: 12px;
    font-weight: bold;
}

#interactButton:active {
    background: rgba(255,255,255,.3);
}

/* =========================
   MODAL
========================= */

#modal {
    position: fixed;
    inset: 0;

    z-index: 50;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);

    pointer-events: auto;
}

#modal.active {
    display: flex;
}

.modalBox {
    width: min(650px, 90vw);

    background: #111;

    border: 1px solid #444;

    padding: 35px;

    box-shadow: 0 20px 80px rgba(0,0,0,.8);
}

.modalBox h2 {
    font-size: 25px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.modalBox p {
    color: #aaa;
    line-height: 1.6;
    margin-bottom: 25px;
}

.modalButton {
    background: #ddd;
    color: #111;

    border: none;

    padding: 13px 22px;

    font-weight: bold;

    cursor: pointer;
}

.modalButton:hover {
    background: white;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 901px) {
    #mobileControls {
        display: none;
    }
}

/* =========================
   CELULAR VERTICAL
========================= */

@media (orientation: portrait) {
    #rotateScreen {
        display: flex;
    }

    #ui,
    canvas {
        visibility: hidden;
    }
}

/* =========================
   CELULAR HORIZONTAL
========================= */

@media (orientation: landscape) and (max-width: 900px) {

    #mobileControls {
        display: block;
        pointer-events: auto;
    }

    #crosshair {
        width: 7px;
        height: 7px;
    }

    #topbar {
        height: 55px;
        padding: 0 15px;
    }

    .logo {
        font-size: 14px;
    }

    .oic {
        font-size: 8px;
    }

    .reputation {
        padding: 7px 10px;
        font-size: 11px;
    }

    #interaction {
        bottom: 17%;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- ==========================================
     PANTALLA DE ROTACIÓN
========================================== -->

<div id="rotateScreen">

    <div class="rotateBox">

        <h1>CRIMEHUNTER</h1>

        <p>
            Para jugar, gira tu dispositivo
            horizontalmente.
        </p>

    </div>

</div>


<!-- ==========================================
     INTERFAZ
========================================== -->

<div id="ui">

    <div id="topbar">

        <div>
            <div class="logo">
                CRIMEHUNTER
            </div>

            <div class="oic">
                OFICINA DE INVESTIGACIONES DE CRÍMENES
            </div>
        </div>

        <div class="reputation">
            REPUTACIÓN:
            <strong id="reputation">
                3500
            </strong>
        </div>

    </div>

    <div id="crosshair"></div>

    <div id="interaction">
        E — INTERACTUAR
    </div>

    <!-- CONTROLES CELULAR -->

    <div id="mobileControls">

        <div id="joystick">
            <div id="joystickKnob"></div>
        </div>

        <div id="lookArea"></div>

        <button id="interactButton">
            INTERACTUAR
        </button>

    </div>

</div>


<!-- ==========================================
     MODAL
========================================== -->

<div id="modal">

    <div class="modalBox">

        <h2 id="modalTitle">
            CRIMEHUNTER
        </h2>

        <p id="modalText">
            ...
        </p>

        <button
            class="modalButton"
            onclick="closeModal()">
            CERRAR
        </button>

    </div>

</div>


<!-- ==========================================
     THREE.JS
========================================== -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
} from "three/addons/controls/PointerLockControls.js";


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const isMobile =
    window.innerWidth <= 900;


/* =====================================================
   ESCENA
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x070707);

scene.fog =
    new THREE.Fog(
        0x070707,
        8,
        28
    );


/* =====================================================
   CÁMARA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    1.7,
    7
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.8
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   ILUMINACIÓN
===================================================== */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.35
    );

scene.add(ambientLight);


const ceilingLight =
    new THREE.PointLight(
        0xffffff,
        30,
        18
    );

ceilingLight.position.set(
    0,
    3.7,
    0
);

ceilingLight.castShadow = true;

scene.add(ceilingLight);


/* =====================================================
   MATERIALES
===================================================== */

const wallMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x292929
    });

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x161616
    });

const darkMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x0c0c0c
    });

const woodMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x332a22
    });

const metalMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x383838,
        metalness: .6,
        roughness: .35
    });

const screenMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x111a1c,
        emissive: 0x092126,
        emissiveIntensity: 1.4
    });


/* =====================================================
   FUNCIÓN CUBO
===================================================== */

function createBox(
    width,
    height,
    depth,
    material,
    x,
    y,
    z
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}


/* =====================================================
   HABITACIÓN
===================================================== */

// Piso

createBox(
    20,
    .2,
    16,
    floorMaterial,
    0,
    0,
    0
);


// Pared trasera

createBox(
    20,
    5,
    .2,
    wallMaterial,
    0,
    2.5,
    -8
);


// Pared izquierda

createBox(
    .2,
    5,
    16,
    wallMaterial,
    -10,
    2.5,
    0
);


// Pared derecha

createBox(
    .2,
    5,
    16,
    wallMaterial,
    10,
    2.5,
    0
);


// Pared frontal con espacio de entrada

createBox(
    7,
    5,
    .2,
    wallMaterial,
    -6.5,
    2.5,
    8
);

createBox(
    7,
    5,
    .2,
    wallMaterial,
    6.5,
    2.5,
    8
);


/* =====================================================
   ESCRITORIO
===================================================== */

const desk =
    createBox(
        4.5,
        .25,
        2,
        woodMaterial,
        0,
        1.45,
        1
    );


// Patas

createBox(
    .25,
    1.45,
    .25,
    metalMaterial,
    -1.9,
    .72,
    .3
);

createBox(
    .25,
    1.45,
    .25,
    metalMaterial,
    1.9,
    .72,
    .3
);

createBox(
    .25,
    1.45,
    .25,
    metalMaterial,
    -1.9,
    .72,
    1.7
);

createBox(
    .25,
    1.45,
    .25,
    metalMaterial,
    1.9,
    .72,
    1.7
);


/* =====================================================
   COMPUTADORA
===================================================== */

const monitor =
    createBox(
        2,
        1.2,
        .12,
        darkMaterial,
        0,
        2.15,
        .7
    );

monitor.userData.interactive = true;
monitor.userData.type = "computer";
monitor.userData.name = "COMPUTADORA";


const screen =
    createBox(
        1.7,
        .85,
        .02,
        screenMaterial,
        0,
        2.15,
        .62
    );


const monitorStand =
    createBox(
        .12,
        .6,
        .12,
        metalMaterial,
        0,
        1.65,
        .7
    );


/* =====================================================
   TECLADO
===================================================== */

const keyboard =
    createBox(
        1.6,
        .08,
        .55,
        metalMaterial,
        0,
        1.62,
        1.15
    );

keyboard.userData.interactive = true;
keyboard.userData.type = "computer";


/* =====================================================
   SILLA
===================================================== */

createBox(
    1.3,
    .18,
    1.3,
    darkMaterial,
    0,
    1.05,
    3
);

createBox(
    1.2,
    1.5,
    .18,
    darkMaterial,
    0,
    1.75,
    3.55
);

createBox(
    .12,
    1,
    .12,
    metalMaterial,
    0,
    .5,
    3
);


/* =====================================================
   PIZARRA DE INVESTIGACIÓN
===================================================== */

const board =
    createBox(
        5,
        2.6,
        .12,
        darkMaterial,
        -4,
        2.4,
        -7.82
    );

board.userData.interactive = true;
board.userData.type = "board";
board.userData.name = "PIZARRA DE INVESTIGACIÓN";


/* =====================================================
   MARCOS / PISTAS EN PIZARRA
===================================================== */

for (let i = 0; i < 5; i++) {

    const clue =
        createBox(
            .55,
            .75,
            .03,
            screenMaterial,
            -5.5 + i * 0.75,
            2.5,
            -7.73
        );

    clue.userData.interactive = true;
    clue.userData.type = "evidence";

}


/* =====================================================
   ARCHIVADOR
===================================================== */

const cabinet =
    createBox(
        1.5,
        2.8,
        1,
        metalMaterial,
        7,
        1.4,
        -5.5
    );

cabinet.userData.interactive = true;
cabinet.userData.type = "files";
cabinet.userData.name = "ARCHIVADOR";


/* =====================================================
   CAJONES
===================================================== */

for (let i = 0; i < 4; i++) {

    createBox(
        1.25,
        .4,
        .05,
        darkMaterial,
        7,
        .55 + i * .6,
        -4.96
    );

}


/* =====================================================
   PUERTA
===================================================== */

const door =
    createBox(
        2.4,
        4.2,
        .18,
        woodMaterial,
        0,
        2.1,
        7.82
    );

door.userData.interactive = true;
door.userData.type = "door";
door.userData.name = "SALIDA";


/* =====================================================
   LÁMPARA
===================================================== */

const lamp =
    createBox(
        2.5,
        .12,
        .8,
        metalMaterial,
        0,
        4.5,
        -1
    );


/* =====================================================
   OBJETOS DECORATIVOS
===================================================== */

// Taza

createBox(
    .25,
    .3,
    .25,
    metalMaterial,
    -1.5,
    1.72,
    1
);


// Teléfono

const phone =
    createBox(
        .5,
        .12,
        .9,
        darkMaterial,
        1.5,
        1.68,
        1
    );

phone.userData.interactive = true;
phone.userData.type = "phone";
phone.userData.name = "TELÉFONO";


/* =====================================================
   CONTROLES PC
===================================================== */

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


if (!isMobile) {

    renderer.domElement.addEventListener(
        "click",
        () => {

            if (
                !document.getElementById("modal")
                    .classList.contains("active")
            ) {

                controls.lock();

            }

        }
    );

}


/* =====================================================
   MOVIMIENTO
===================================================== */

const keys = {
    forward: false,
    backward: false,
    left: false,
    right: false
};


document.addEventListener(
    "keydown",
    event => {

        if (event.code === "KeyW")
            keys.forward = true;

        if (event.code === "KeyS")
            keys.backward = true;

        if (event.code === "KeyA")
            keys.left = true;

        if (event.code === "KeyD")
            keys.right = true;

        if (event.code === "KeyE")
            interact();

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (event.code === "KeyW")
            keys.forward = false;

        if (event.code === "KeyS")
            keys.backward = false;

        if (event.code === "KeyA")
            keys.left = false;

        if (event.code === "KeyD")
            keys.right = false;

    }
);


/* =====================================================
   MOVIMIENTO MÓVIL
===================================================== */

let mobileForward = 0;
let mobileSide = 0;

const joystick =
    document.getElementById("joystick");

const knob =
    document.getElementById("joystickKnob");

let joystickActive = false;


joystick.addEventListener(
    "touchstart",
    event => {

        joystickActive = true;

        updateJoystick(
            event.touches[0]
        );

    },
    { passive: false }
);


joystick.addEventListener(
    "touchmove",
    event => {

        if (!joystickActive)
            return;

        event.preventDefault();

        updateJoystick(
            event.touches[0]
        );

    },
    { passive: false }
);


joystick.addEventListener(
    "touchend",
    () => {

        joystickActive = false;

        mobileForward = 0;
        mobileSide = 0;

        knob.style.transform =
            "translate(-50%, -50%)";

    }
);


function updateJoystick(touch) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    let x =
        touch.clientX - centerX;

    let y =
        touch.clientY - centerY;

    const max =
        40;

    const distance =
        Math.sqrt(x*x + y*y);

    if (distance > max) {

        x =
            x / distance * max;

        y =
            y / distance * max;

    }

    knob.style.transform =
        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

    mobileSide =
        x / max;

    mobileForward =
        -y / max;

}


/* =====================================================
   MIRAR EN CELULAR
===================================================== */

const lookArea =
    document.getElementById("lookArea");

let lastTouchX = null;
let lastTouchY = null;


lookArea.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.touches[0];

        lastTouchX =
            touch.clientX;

        lastTouchY =
            touch.clientY;

    },
    { passive: true }
);


lookArea.addEventListener(
    "touchmove",
    event => {

        const touch =
            event.touches[0];

        if (
            lastTouchX === null ||
            lastTouchY === null
        )
            return;

        const dx =
            touch.clientX - lastTouchX;

        const dy =
            touch.clientY - lastTouchY;

        camera.rotation.y -=
            dx * 0.004;

        camera.rotation.x -=
            dy * 0.0025;

        camera.rotation.x =
            THREE.MathUtils.clamp(
                camera.rotation.x,
                -1.25,
                1.25
            );

        lastTouchX =
            touch.clientX;

        lastTouchY =
            touch.clientY;

        event.preventDefault();

    },
    { passive: false }
);


lookArea.addEventListener(
    "touchend",
    () => {

        lastTouchX = null;
        lastTouchY = null;

    }
);


document.getElementById(
    "interactButton"
).addEventListener(
    "click",
    interact
);


/* =====================================================
   RAYCASTER
===================================================== */

const raycaster =
    new THREE.Raycaster();

const center =
    new THREE.Vector2(0, 0);

let currentInteractive = null;


function detectObject() {

    raycaster.setFromCamera(
        center,
        camera
    );

    const objects =
        scene.children.filter(
            object =>
                object.userData &&
                object.userData.interactive
        );

    const intersections =
        raycaster.intersectObjects(
            objects,
            false
        );

    if (
        intersections.length &&
        intersections[0].distance < 4
    ) {

        currentInteractive =
            intersections[0].object;

        document
            .getElementById("interaction")
            .classList.add("visible");

        document
            .getElementById("interaction")
            .textContent =
            isMobile
                ? "INTERACTUAR"
                : "E — INTERACTUAR";

    } else {

        currentInteractive = null;

        document
            .getElementById("interaction")
            .classList.remove("visible");

    }

}


/* =====================================================
   INTERACCIÓN
===================================================== */

function interact() {

    if (!currentInteractive)
        return;

    const type =
        currentInteractive.userData.type;

    if (type === "computer") {

        openModal(
            "SISTEMA OIC",
            "Terminal de investigación. Próximamente desde aquí podrás acceder a las cámaras de seguridad, consultar registros y analizar movimientos."
        );

    }

    else if (type === "board") {

        openModal(
            "PIZARRA DE INVESTIGACIÓN",
            "Aquí aparecerán las fotografías, pistas, sospechosos y conexiones descubiertas durante la investigación."
        );

    }

    else if (type === "evidence") {

        openModal(
            "EVIDENCIA",
            "Todavía no se ha analizado esta evidencia. En la versión de investigación podrás inspeccionarla y vincularla con los sospechosos."
        );

    }

    else if (type === "files") {

        openModal(
            "ARCHIVADOR",
            "Expedientes de la OIC. Aquí podrás consultar tus casos actuales, casos resueltos y expedientes anteriores."
        );

    }

    else if (type === "phone") {

        openModal(
            "TELÉFONO",
            "Línea interna de la OIC. Las llamadas de la central aparecerán aquí cuando haya nueva información sobre el caso."
        );

    }

    else if (type === "door") {

        openModal(
            "SALIR DE LA OFICINA",
            "Desde aquí podrás regresar al listado de casos."
        );

    }

}


/* =====================================================
   MODAL
===================================================== */

function openModal(title, text) {

    document.getElementById(
        "modalTitle"
    ).textContent = title;

    document.getElementById(
        "modalText"
    ).textContent = text;

    document.getElementById(
        "modal"
    ).classList.add("active");

    if (
        !isMobile &&
        controls.isLocked
    ) {

        controls.unlock();

    }

}


window.closeModal =
    function () {

        document.getElementById(
            "modal"
        ).classList.remove("active");

    };


/* =====================================================
   MOVIMIENTO Y COLISIONES BÁSICAS
===================================================== */

const velocity =
    new THREE.Vector3();

const direction =
    new THREE.Vector3();

const clock =
    new THREE.Clock();


function movePlayer(delta) {

    const speed =
        4 * delta;

    direction.set(0, 0, 0);

    if (
        keys.forward ||
        mobileForward > .1
    )
        direction.z -= 1;

    if (
        keys.backward ||
        mobileForward < -.1
    )
        direction.z += 1;

    if (
        keys.left ||
        mobileSide < -.1
    )
        direction.x -= 1;

    if (
        keys.right ||
        mobileSide > .1
    )
        direction.x += 1;


    if (direction.length() > 0)
        direction.normalize();


    const forwardAmount =
        direction.z;

    const sideAmount =
        direction.x;


    // PC

    if (!isMobile) {

        if (forwardAmount !== 0)
            controls.moveForward(
                -forwardAmount * speed
            );

        if (sideAmount !== 0)
            controls.moveRight(
                sideAmount * speed
            );

    }

    // Celular

    else {

        const forward =
            new THREE.Vector3();

        camera.getWorldDirection(
            forward
        );

        forward.y = 0;
        forward.normalize();

        const right =
            new THREE.Vector3();

        right.crossVectors(
            forward,
            camera.up
        ).normalize();

        camera.position.addScaledVector(
            forward,
            mobileForward * speed
        );

        camera.position.addScaledVector(
            right,
            mobileSide * speed
        );

    }


    // Altura fija

    camera.position.y = 1.7;


    // Límites de la oficina

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -9,
            9
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -7,
            7
        );

}


/* =====================================================
   ANIMACIÓN
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    movePlayer(delta);

    detectObject();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   REPUTACIÓN
===================================================== */

let reputation = 3500;

function updateReputation() {

    document.getElementById(
        "reputation"
    ).textContent =
        reputation;

}

updateReputation();


/* =====================================================
   PREPARACIÓN PARA EL SISTEMA DE CASOS
===================================================== */

const gameState = {

    reputation: 3500,

    currentCase: null,

    suspects: [],

    evidence: [],

    cameras: [],

    guiltySuspect: null,

    keyEvidence: null

};


// Lo dejamos disponible para
// conectar el resto del juego después.

window.Crimehunter =
    gameState;


</script>
