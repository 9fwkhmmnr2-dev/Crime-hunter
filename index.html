<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crimehunter</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#202020;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#portrait{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#111;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:20px;
    padding:30px;
}

@media(max-width:900px) and (orientation:portrait){
    #portrait{
        display:flex;
    }
}

#hud{
    position:absolute;
    top:14px;
    left:15px;
    color:white;
    z-index:10;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
}

#title{
    font-size:17px;
    font-weight:bold;
    letter-spacing:2px;
}

#rep{
    margin-top:5px;
    font-size:12px;
}

#help{
    position:absolute;
    right:15px;
    top:15px;
    color:#ddd;
    font-size:11px;
    text-align:right;
    z-index:10;
    pointer-events:none;
}

@media(max-width:900px){
    #help{
        display:none;
    }
}

#interaction{
    position:absolute;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.75);
    color:white;
    padding:10px 17px;
    border-radius:7px;
    font-size:13px;
    display:none;
    z-index:20;
    pointer-events:none;
}

#mobileControls{
    display:none;
    position:absolute;
    inset:0;
    z-index:30;
    pointer-events:none;
}

@media(max-width:900px) and (orientation:landscape){
    #mobileControls{
        display:block;
    }
}

#joystick{
    position:absolute;
    width:120px;
    height:120px;
    left:24px;
    bottom:22px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.20);
    pointer-events:auto;
    touch-action:none;
}

#knob{
    position:absolute;
    width:52px;
    height:52px;
    left:32px;
    top:32px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    border:2px solid rgba(255,255,255,.35);
}

#look{
    position:absolute;
    right:0;
    top:0;
    width:58%;
    height:100%;
    pointer-events:auto;
    touch-action:none;
}

#useButton{
    position:absolute;
    right:25px;
    bottom:27px;
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.55);
    color:white;
    font-size:11px;
    pointer-events:auto;
    touch-action:none;
}

#modal{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    align-items:center;
    justify-content:center;
    padding:20px;
}

#modalBox{
    width:min(650px,92vw);
    max-height:85vh;
    overflow:auto;
    background:#eeeae1;
    color:#171717;
    border-radius:10px;
    padding:24px;
}

#modalTitle{
    font-size:21px;
    font-weight:bold;
    margin-bottom:14px;
}

#modalContent{
    line-height:1.5;
    font-size:14px;
}

#close{
    margin-top:20px;
    border:0;
    background:#202020;
    color:white;
    padding:10px 18px;
    border-radius:6px;
}
</style>

function cube(
    w,h,d,
    mat,
    x,y,z,
    name=""
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(w,h,d),
            mat
        );

    mesh.position.set(x,y,z);

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    mesh.userData.name=name;

    scene.add(mesh);

    return mesh;
}

function cyl(
    radius,
    height,
    mat,
    x,y,z
){

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                16
            ),
            mat
        );

    mesh.position.set(x,y,z);

    mesh.castShadow=true;

    scene.add(mesh);

    return mesh;
}

/* =====================================================
   INTERACCIÓN
===================================================== */

const objects={

    computer:{
        title:"SISTEMA OIC",
        text:`
        <b>Sistema de cámaras de la OIC</b>
        <br><br>
        Desde esta computadora podrás revisar
        las cámaras de seguridad de los casos.
        <br><br>
        <b>Próximamente:</b> cámaras, reproducción,
        línea temporal y evidencias.
        `
    },

    board:{
        title:"PIZARRA DE INVESTIGACIÓN",
        text:`
        <b>Panel del caso</b>
        <br><br>
        Aquí se organizarán fotografías,
        sospechosos, pistas y conexiones.
        `
    },

    phone:{
        title:"TELÉFONO",
        text:`

        <br><br>

        `
    },

        `
    }

};

const raycaster =
    new THREE.Raycaster();

const center =
    new THREE.Vector2(0,0);

let currentObject=null;

function findInteractive(){

    raycaster.setFromCamera(
        center,
        camera
    );

    const hits =
        raycaster.intersectObjects(
            scene.children,
            true
        );

    currentObject=null;

    for(const hit of hits){

        let obj=hit.object;

        while(obj){

            if(
                obj.userData &&
                objects[obj.userData.name]
            ){

                currentObject =
                    objects[obj.userData.name];

                document
                    .getElementById("interaction")
                    .style.display="block";

                return;
            }

            obj=obj.parent;
        }
    }

    document
        .getElementById("interaction")
        .style.display="none";
}

function interact(){

    if(!currentObject)
        return;

    document
        .getElementById("modalTitle")
        .textContent=
        currentObject.title;

    document
        .getElementById("modalContent")
        .innerHTML=
        currentObject.text;

    document
        .getElementById("modal")
        .style.display="flex";
}

document
    .getElementById("close")
    .onclick=()=>{
        document
            .getElementById("modal")
            .style.display="none";
    };

/* =====================================================
   PC: POINTER LOCK SIMPLE
===================================================== */

let locked=false;

renderer.domElement.addEventListener(
    "click",
    ()=>{
        if(
            window.innerWidth>900 &&
            document.getElementById("modal").style.display!=="flex"
        ){
            renderer.domElement.requestPointerLock();
        }
    }
);

document.addEventListener(
    "pointerlockchange",
    ()=>{
        locked=
            document.pointerLockElement===
            renderer.domElement;
    }
);

document.addEventListener(
    "mousemove",
    e=>{

        if(!locked)
            return;

        yaw-=e.movementX*.0025;
        pitch-=e.movementY*.0025;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.25,
                1.25
            );

        updateCamera();

    }
);

/* =====================================================
   TECLADO
===================================================== */

const keys={};

document.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(e.code==="KeyE"){
            interact();
        }

    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);

/* =====================================================
   CÁMARA
===================================================== */

function updateCamera(){

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
    camera.rotation.z=0;
}

/* =====================================================
   MOVIMIENTO
===================================================== */

const movement =
    new THREE.Vector3();

function moveDesktop(delta){

    if(!locked)
        return;

    let forward=0;
    let side=0;

    if(keys["KeyW"])
        forward+=1;

    if(keys["KeyS"])
        forward-=1;

    if(keys["KeyA"])
        side-=1;

    if(keys["KeyD"])
        side+=1;

    if(
        forward===0 &&
        side===0
    )
        return;

    movement.set(
        side,
        0,
        -forward
    );

    movement.normalize();

    movement.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );

    camera.position.x +=
        movement.x*2.1*delta;

    camera.position.z +=
        movement.z*2.1*delta;

    clampPosition();
}

/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById("joystick");

const knob =
    document.getElementById("knob");

let joyX=0;
let joyY=0;
let joyPointer=null;

function joystickUpdate(e){

    const r=
        joystick.getBoundingClientRect();

    let x=
        e.clientX-
        (r.left+r.width/2);

    let y=
        e.clientY-
        (r.top+r.height/2);

    const max=43;

    const distance=
        Math.sqrt(x*x+y*y);

    if(distance>max){

        x=x/distance*max;
        y=y/distance*max;

    }

    joyX=x/max;
    joyY=y/max;

    knob.style.left=
        (32+x)+"px";

    knob.style.top=
        (32+y)+"px";
}

function joystickReset(){

    joyX=0;
    joyY=0;

    knob.style.left="32px";
    knob.style.top="32px";

    joyPointer=null;
}

joystick.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        joyPointer=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickUpdate(e);

    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId===
            joyPointer
        ){
            joystickUpdate(e);
        }

    }
);

joystick.addEventListener(
    "pointerup",
    joystickReset
);

joystick.addEventListener(
    "pointercancel",
    joystickReset
);

/* =====================================================
   MIRAR CON EL DEDO
===================================================== */

const look=
    document.getElementById("look");

let lookPointer=null;
let lastX=0;
let lastY=0;

look.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        lookPointer=e.pointerId;

        look.setPointerCapture(
            e.pointerId
        );

        lastX=e.clientX;
        lastY=e.clientY;

    }
);

look.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId!==
            lookPointer
        )
            return;

        const dx=
            e.clientX-lastX;

        const dy=
            e.clientY-lastY;

        lastX=e.clientX;
        lastY=e.clientY;

        yaw-=dx*.0045;
        pitch-=dy*.0045;

        pitch=
            THREE.MathUtils.clamp(
                pitch,
                -1.25,
                1.25
            );

        updateCamera();

    }
);

look.addEventListener(
    "pointerup",
    ()=>{
        lookPointer=null;
    }
);

look.addEventListener(
    "pointercancel",
    ()=>{
        lookPointer=null;
    }
);

/* =====================================================
   MOVIMIENTO MÓVIL
===================================================== */

function moveMobile(delta){

    if(
        Math.abs(joyX)<.05 &&
        Math.abs(joyY)<.05
    )
        return;

    /*
       Importante:
       joystick arriba = avanzar
       joystick abajo = retroceder
       izquierda = izquierda
       derecha = derecha
    */

    const forward=-joyY;
    const side=joyX;

    movement.set(
        side,
        0,
        -forward
    );

    movement.normalize();

    movement.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );

    camera.position.x +=
        movement.x*2.0*delta;

    camera.position.z +=
        movement.z*2.0*delta;

    clampPosition();
}

/* =====================================================
   LÍMITES
===================================================== */

function clampPosition(){

    camera.position.x=
        THREE.MathUtils.clamp(
            camera.position.x,
            -3.35,
            3.35
        );

    camera.position.z=
        THREE.MathUtils.clamp(
            camera.position.z,
            -1.15,
            2.55
        );

    camera.position.y=1.60;
}

/* =====================================================
   BOTÓN USAR
===================================================== */

document
    .getElementById("useButton")
    .addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            interact();
        }
    );

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

/* =====================================================
   INICIO
===================================================== */

updateCamera();

/* =====================================================
   LOOP
===================================================== */

const clock=
    new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(window.innerWidth>900)
        moveDesktop(delta);
    else
        moveMobile(delta);

    findInteractive();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</html>
