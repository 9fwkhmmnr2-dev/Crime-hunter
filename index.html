<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Crimehunter</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

canvas{
    display:block;
}

/* =========================
   PORTRAIT
========================= */

#portrait{
    display:none;
    position:absolute;
    inset:0;
    background:#111;
    color:white;
    z-index:1000;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:20px;
}

@media (orientation:portrait){
    #portrait{
        display:flex;
    }
}

/* =========================
   UI
========================= */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    z-index:20;
    pointer-events:none;
    text-shadow:0 2px 5px #000;
}

#title{
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
}

#rep{
    margin-top:5px;
    font-size:13px;
}

#interaction{
    position:absolute;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.72);
    color:white;
    padding:11px 18px;
    border-radius:8px;
    font-size:14px;
    display:none;
    z-index:30;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls{
    display:none;
    position:absolute;
    inset:0;
    z-index:40;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.09);
    border:2px solid rgba(255,255,255,.18);
    pointer-events:auto;
    touch-action:none;
}

#joystickKnob{
    position:absolute;
    width:55px;
    height:55px;
    left:35px;
    top:35px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    border:2px solid rgba(255,255,255,.35);
}

#lookArea{
    position:absolute;
    right:0;
    top:0;
    width:55%;
    height:100%;
    pointer-events:auto;
    touch-action:none;
}

#interactButton{
    position:absolute;
    right:25px;
    bottom:30px;
    width:75px;
    height:75px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.5);
    color:white;
    font-size:12px;
    pointer-events:auto;
    touch-action:none;
}

@media (max-width:900px) and (orientation:landscape){

    #mobileControls{
        display:block;
    }

    #hud{
        top:8px;
        left:10px;
    }

    #title{
        font-size:14px;
    }

    #rep{
        font-size:11px;
    }
}

/* =========================
   MODAL
========================= */

#modal{
    display:none;
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    align-items:center;
    justify-content:center;
    padding:20px;
}

#modalBox{
    width:min(720px,92vw);
    max-height:85vh;
    overflow:auto;
    background:#f0eee8;
    color:#1b1b1b;
    border-radius:10px;
    box-shadow:0 15px 50px rgba(0,0,0,.6);
    padding:25px;
}

#modalTitle{
    font-size:22px;
    margin-bottom:15px;
}

#modalContent{
    line-height:1.5;
}

#closeModal{
    margin-top:20px;
    padding:10px 18px;
    border:0;
    border-radius:6px;
    background:#202020;
    color:white;
    cursor:pointer;
}

/* =========================
   DESKTOP HELP
========================= */

#controlsHelp{
    position:absolute;
    right:15px;
    top:15px;
    color:rgba(255,255,255,.65);
    font-size:11px;
    text-align:right;
    z-index:20;
    pointer-events:none;
}

@media(max-width:900px){
    #controlsHelp{
        display:none;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="portrait">
        Girá tu teléfono horizontalmente para jugar.
    </div>

    <div id="hud">
        <div id="title">CRIMEHUNTER</div>
        <div id="rep">Reputación: 3500</div>
    </div>

    <div id="controlsHelp">
        WASD — Moverse<br>
        Mouse — Mirar<br>
        Click — Interactuar
    </div>

    <div id="interaction">
        Interactuar
    </div>

    <div id="mobileControls">

        <div id="joystick">
            <div id="joystickKnob"></div>
        </div>

        <div id="lookArea"></div>

        <button id="interactButton">
            USAR
        </button>

    </div>

    <div id="modal">
        <div id="modalBox">
            <div id="modalTitle"></div>
            <div id="modalContent"></div>
            <button id="closeModal">Cerrar</button>
        </div>
    </div>

</div>

        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">

/* =========================================================

function box(
    w,
    h,
    d,
    material,
    x,
    y,
    z,
    name=""
){

    const geometry =
        new THREE.BoxGeometry(w,h,d);

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    mesh.userData.name = name;

    scene.add(mesh);

    return mesh;
}

function cylinder(
    radius,
    height,
    material,
    x,
    y,
    z
){

    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            20
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

function plane(
    w,
    h,
    material,
    x,
    y,
    z,
    rx=0,
    ry=0
){

    const geometry =
        new THREE.PlaneGeometry(w,h);

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(x,y,z);
    mesh.rotation.x = rx;
    mesh.rotation.y = ry;

    scene.add(mesh);

    return mesh;
}

/* Líneas de investigación */

function boardLine(
    x1,y1,x2,y2
){

    const dx=x2-x1;
    const dy=y2-y1;

    const length=Math.sqrt(
        dx*dx+dy*dy
    );

    const line=box(
        length,
        .012,
        .012,
        new THREE.MeshStandardMaterial({
            color:0x8b2727
        }),
        (x1+x2)/2,
        (y1+y2)/2,
        -2.155
    );

    line.rotation.z=
        Math.atan2(dy,dx);
}

);

/* =========================================================
   MODAL
========================================================= */

const modal =

const modalTitle =
    document.getElementById("modalTitle");

const modalContent =

document
    .getElementById("closeModal")
    .onclick = () => {

function openModal(title,content){

    modalTitle.textContent=title;
    modalContent.innerHTML=content;

    modal.style.display="flex";
}

/* =========================================================
   RAYCAST
========================================================= */

const raycaster =
    new THREE.Raycaster();

const center =
    new THREE.Vector2(0,0);

let currentInteractive=null;

function checkInteraction(){

    raycaster.setFromCamera(
        center,
        camera
    );

    const hits =
        raycaster.intersectObjects(
            scene.children,
            true
        );

    currentInteractive=null;

    for(const hit of hits){

        const obj =
            hit.object;

        let target=obj;

        while(target){

            const found =
